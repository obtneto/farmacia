<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="title desc">
  <title id="title">Farmácia Ambulatorial - Sider Expandido</title>
  <desc id="desc">Logomarca horizontal com ícone farmacêutico e texto Farmácia Ambulatorial.</desc>
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00a890"/>
      <stop offset="1" stop-color="#007f70"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ac943"/>
      <stop offset="1" stop-color="#006f3c"/>
    </linearGradient>
    <linearGradient id="pillStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff9f4"/>
      <stop offset="1" stop-color="#8ce3d4"/>
    </linearGradient>
    <linearGradient id="pillFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17b89d"/>
      <stop offset="1" stop-color="#0b866f"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(34 26)">
    <!-- medical cross -->
    <path d="M36 14h34a11 11 0 0 1 11 11v29h29a11 11 0 0 1 11 11v32a11 11 0 0 1-11 11H81v29a11 11 0 0 1-11 11H36a11 11 0 0 1-11-11v-29H-4A11 11 0 0 1-15 97V65A11 11 0 0 1-4 54h29V25a11 11 0 0 1 11-11z" fill="url(#teal)" opacity=".96"/>

    <!-- capsule -->
    <g transform="translate(70 10) rotate(34 54 54)">
      <rect x="8" y="16" width="92" height="76" rx="38" fill="#ffffff" opacity=".98"/>
      <path d="M54 16h46a38 38 0 0 1 0 76H54z" fill="url(#pillFill)"/>
      <rect x="8" y="16" width="92" height="76" rx="38" fill="none" stroke="url(#pillStroke)" stroke-width="7"/>
      <line x1="54" y1="20" x2="54" y2="88" stroke="#b7efe4" stroke-width="5" stroke-linecap="round"/>
      <path d="M24 33c7-8 17-12 27-12" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    </g>

    <!-- leaves/care cradle -->
    <path d="M2 112c45 11 81 36 96 70-50 2-87-22-96-70z" fill="#79bf43"/>
    <path d="M66 182c45-5 96-24 138-66-55 4-94 20-117 49-7 8-13 13-21 17z" fill="url(#leaf)"/>
    <path d="M110 160c26-18 52-32 80-41" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".94"/>
  </g>

  <!-- Text -->
  <g transform="translate(282 74)">
    <text x="0" y="0" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="58" font-weight="800" fill="#effcf8" letter-spacing="-.8">Farmácia</text>
    <text x="0" y="70" font-family="Inter, Segoe UI, Roboto, Arial, sans-serif" font-size="48" font-weight="700" fill="#1dd6bc" letter-spacing="-.3">Ambulatorial</text>
  </g>
</svg>
