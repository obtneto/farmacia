<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Retângulo de fundo com gradiente -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fundo principal -->
  <rect x="20" y="40" width="260" height="100" fill="url(#grad)" rx="8"/>
  
  <!-- Letra G com sombreamento -->
  <text x="45" y="115" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="85" 
        fill="#ffffff" 
        font-weight="900"
        style="filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.3));">
    G
  </text>
  
  <!-- Linha separadora vertical -->
  <line x1="95" y1="60" x2="95" y2="120" 
        stroke="#ffffff" 
        stroke-width="2" 
        opacity="0.5"/>
  
  <!-- QUEIROZ em fonte moderna -->
  <text x="110" y="100" 
        font-family="Arial, sans-serif" 
        font-size="42" 
        fill="#ffffff" 
        font-weight="700"
        letter-spacing="1">
    QUEIROZ
  </text>
  
  <!-- Subtítulo/Descrição -->
  <text x="110" y="125" 
        font-family="Arial, sans-serif" 
        font-size="16" 
        fill="#ffffff" 
        font-weight="400"
        letter-spacing="3"
        opacity="0.9">
    CREDIÁRIO
  </text>
</svg>
