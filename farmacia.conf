<VirtualHost *:80>
    ServerName farmacia.local
    ServerAlias www.farmacia.local
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/farmacia
    Alias /farmacia /var/www/farmacia

    <Directory /var/www/farmacia>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /farmacia/
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . index.html [L]

    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/farmacia_error.log
    CustomLog ${APACHE_LOG_DIR}/farmacia_access.log combined
</VirtualHost>
